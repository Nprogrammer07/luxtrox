name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Mockito + Testcontainers (Postgres real via Docker, ya disponible
  # de forma nativa en los runners de ubuntu-latest) + RestAssured +
  # el gate de cobertura de JaCoCo (90% en los paquetes de logica real
  # -- ver pom.xml, Fase 8). Si esto falla, el pipeline se detiene
  # aqui: el job de Docker mas abajo nunca corre.
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn clean test
        run: mvn clean test -B

      - name: Subir reporte de cobertura (target/site/jacoco)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # Solo corre en push a main (nunca en pull requests -- no tiene
  # sentido publicar una imagen por cada rama en revision). Construye
  # la MISMA imagen del Dockerfile de la Fase 10, sin cambios, y la
  # publica en GitHub Container Registry. Railway (o lo que sea que
  # se use en la Fase 12) puede consumir esta imagen directamente, o
  # construir la suya propia desde el mismo Dockerfile -- cualquiera
  # de las dos funciona, esto no se vuelve a reconfigurar.
  docker:
    name: Build y publicar imagen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre del repo en minusculas (GHCR lo exige asi)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Metadata de la imagen (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_LC }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max