spring:
  application:
    name: luxtrox-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway (no Hibernate) es el dueno del esquema. "validate" hace que
    # la app falle al arrancar si una entidad no calza exactamente con
    # la tabla real -- es nuestra red de seguridad. Nunca usar
    # "update"/"create" aqui.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  # PORT primero: es la convencion que Railway (y Render, Heroku)
  # inyectan automaticamente en runtime -- SERVER_PORT queda como
  # respaldo para cualquier otro entorno que prefiera ese nombre.
  port: ${PORT:${SERVER_PORT:8080}}

# Fase 5 - Spring Security / JWT.
# app.jwt.secret SIEMPRE por variable de entorno, nunca hardcodeado.
# access: 1 hora. refresh: 7 dias (se guarda el HASH en la tabla
# refresh_tokens, nunca el valor real -- ver docs/domain-model.md 2.14).
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Resuelve el problema del primer admin en produccion (ver
  # AdminBootstrapRunner) -- vacio por defecto, sin efecto alguno a
  # menos que se configure BOOTSTRAP_ADMIN_EMAIL explicitamente.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}

  # Fase 7 - Integraciones externas. Todas las credenciales por
  # variable de entorno, ninguna hardcodeada -- ver docs/running-locally.md
  nowpayments:
    api-key: ${NOWPAYMENTS_API_KEY}
    ipn-secret: ${NOWPAYMENTS_IPN_SECRET}
    base-url: https://api.nowpayments.io/v1
    ipn-callback-url: ${NOWPAYMENTS_IPN_CALLBACK_URL}
    success-url: ${NOWPAYMENTS_SUCCESS_URL:http://localhost:3000/checkout/success}
    cancel-url: ${NOWPAYMENTS_CANCEL_URL:http://localhost:3000/checkout/cancel}

  resend:
    api-key: ${RESEND_API_KEY}
    from-address: ${RESEND_FROM_ADDRESS:no-reply@luxtrox.com}

  storage:
    endpoint: ${SUPABASE_STORAGE_ENDPOINT}
    region: ${SUPABASE_STORAGE_REGION}
    access-key-id: ${SUPABASE_STORAGE_ACCESS_KEY_ID}
    secret-access-key: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:luxtrox-files}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoint:
    health:
      # /actuator/health sigue siendo publico (ver SecurityConfig),
      # pero solo muestra UP/DOWN generico a quien no esta autenticado.
      # El detalle por integracion (cual credencial falta, ver
      # health/*HealthIndicator) solo se ve si el que llama esta
      # autenticado con rol ADMIN -- no se quiere filtrar publicamente
      # cual credencial especifica esta mal configurada.
      show-details: when-authorized
      roles: ADMIN
  endpoints:
    web:
      exposure:
        # health/info son publicos (ver SecurityConfig); metrics y
        # prometheus quedan protegidos detras de hasRole("ADMIN") --
        # exponen informacion operativa interna, no son para
        # cualquier usuario autenticado. Prometheus no esta corriendo
        # todavia (Fase 9, alcance acordado) -- esto solo deja el
        # endpoint listo para cuando se conecte uno.
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: luxtrox-backend

logging:
  level:
    com.luxtrox.backend: DEBUG
    org.hibernate.SQL: DEBUG