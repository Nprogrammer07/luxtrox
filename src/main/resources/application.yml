spring:
  application:
    name: luxtrox-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway (no Hibernate) es el dueno del esquema. "validate" hace que
    # la app falle al arrancar si una entidad no calza exactamente con
    # la tabla real -- es nuestra red de seguridad. Nunca usar
    # "update"/"create" aqui.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

# Fase 5 - Spring Security / JWT.
# app.jwt.secret SIEMPRE por variable de entorno, nunca hardcodeado.
# access: 1 hora. refresh: 7 dias (se guarda el HASH en la tabla
# refresh_tokens, nunca el valor real -- ver docs/domain-model.md 2.14).
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.luxtrox.backend: DEBUG
    org.hibernate.SQL: DEBUG
