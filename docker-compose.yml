name: luxtrox-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luxtrox
      POSTGRES_USER: luxtrox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luxtrox}
    ports:
      - "5432:5432"
    volumes:
      - luxtrox-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxtrox -d luxtrox"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Postgres LOCAL de este mismo docker-compose, por defecto -- si
      # prefieres apuntar a Supabase real (igual que en
      # docs/running-locally.md), cambia DB_URL/USERNAME/PASSWORD en tu
      # .env y quita el "depends_on: db" de aqui abajo.
      DB_URL: jdbc:postgresql://db:5432/luxtrox
      DB_USERNAME: luxtrox
      DB_PASSWORD: ${DB_PASSWORD:-luxtrox}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_IPN_CALLBACK_URL: ${NOWPAYMENTS_IPN_CALLBACK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPABASE_STORAGE_ENDPOINT: ${SUPABASE_STORAGE_ENDPOINT:-}
      SUPABASE_STORAGE_REGION: ${SUPABASE_STORAGE_REGION:-}
      SUPABASE_STORAGE_ACCESS_KEY_ID: ${SUPABASE_STORAGE_ACCESS_KEY_ID:-}
      SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  luxtrox-db-data: